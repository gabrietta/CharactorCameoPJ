<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!--
    総合入口のOGP画像・正方形サムネイルの元になる版下。
    scripts/render-scripture-images.mjs がブラウザで開いて撮影する。
      card.html?kind=og      1200×630（OGP）
      card.html?kind=square  512×512（リンクに添えるサムネイル）
  -->
  <title>満足聖典の版下</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&display=block">
  <style>
    :root {
      --night: #130d0e;
      --glow: #3a1c1e;
      --gold: #c9a24a;
      --gold-soft: rgba(201, 162, 74, 0.55);
      --paper: #efe4cc;
      --muted: #9a8a6c;
      --serif: "Noto Serif JP", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; }
    body {
      background: var(--night);
      color: var(--paper);
      font-family: var(--serif);
    }
    .card {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 30% 50%, var(--glow) 0%, rgba(19, 13, 14, 0) 62%),
        radial-gradient(ellipse at 100% 110%, rgba(201, 162, 74, 0.08) 0%, rgba(19, 13, 14, 0) 50%),
        var(--night);
    }
    /* 二重の金の枠 */
    .card::before, .card::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border: 2px solid var(--gold-soft);
    }
    .card::before { inset: 22px; }
    .card::after { inset: 30px; border-width: 1px; border-color: rgba(201, 162, 74, 0.28); }

    /* OGP 1200×630 */
    .og { width: 1200px; height: 630px; display: grid; grid-template-columns: 470px 1fr; align-items: center; padding: 0 90px 0 70px; }
    .og .emblem { width: 400px; justify-self: center; filter: drop-shadow(0 0 40px rgba(201, 162, 74, 0.22)); }
    .og .kicker { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 0.5em; color: var(--gold); }
    .og .title { margin: 10px 0 0; font-size: 138px; font-weight: 900; line-height: 1.05; letter-spacing: 0.08em; color: var(--gold); white-space: nowrap; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.6); }
    .og .rule { width: 100%; height: 1px; margin: 26px 0 22px; background: linear-gradient(90deg, var(--gold-soft), rgba(201, 162, 74, 0)); }
    .og .verse { margin: 0; font-size: 36px; font-weight: 500; letter-spacing: 0.12em; }
    .og .verse b { font-size: 24px; color: var(--muted); font-weight: 700; margin-right: 0.6em; }
    .og .blackout { display: inline-block; width: 5.2em; height: 0.9em; margin-left: 0.2em; vertical-align: -0.08em; background: #050303; box-shadow: inset 0 0 0 1px rgba(201, 162, 74, 0.18); }
    .og .foot { margin: 34px 0 0; font-size: 22px; letter-spacing: 0.3em; color: var(--muted); }

    /* 正方形 512×512 */
    .square { width: 512px; height: 512px; display: grid; place-items: center; align-content: center; gap: 6px; }
    .square::before { inset: 14px; }
    .square::after { inset: 20px; }
    .square .emblem { width: 318px; filter: drop-shadow(0 0 30px rgba(201, 162, 74, 0.25)); }
    .square .title { margin: 0; font-size: 58px; font-weight: 900; letter-spacing: 0.12em; color: var(--gold); line-height: 1.2; padding-left: 0.12em; }
  </style>
</head>
<body>
  <main id="card"></main>
  <script>
    const kind = new URLSearchParams(location.search).get("kind") === "square" ? "square" : "og";
    const card = document.getElementById("card");
    card.className = `card ${kind}`;
    card.innerHTML = kind === "square"
      ? `<img class="emblem" src="../../manzokukyo/viewer/emblem.png" alt="">
         <p class="title">満足聖典</p>`
      : `<img class="emblem" src="../../manzokukyo/viewer/emblem.png" alt="">
         <div>
           <p class="kicker">満足教　教典</p>
           <p class="title">満足聖典</p>
           <div class="rule"></div>
           <p class="verse"><b>1:1</b>はじめに空腹ありき。</p>
           <p class="verse" style="margin-top:10px"><b>1:2</b>空腹は<span class="blackout"></span></p>
           <p class="foot">読む・唱える・学ぶ　総合入口</p>
         </div>`;
  </script>
</body>
</html>
