<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>満足聖典</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700;900&family=Noto+Sans+JP:wght@400;500&display=swap">
  <link rel="icon" href="emblem.png">
  <link rel="stylesheet" href="book.css">
</head>
<body>
  <main class="stage" id="stage" aria-live="polite">
    <p class="loading">頁をひらいています……</p>
  </main>

  <nav class="bar" id="bar" aria-label="頁の操作" hidden>
    <button type="button" id="toc-button" class="bar-button">☰ 目次</button>
    <button type="button" id="prev-button" class="bar-arrow" aria-label="前の頁">‹</button>
    <div class="bar-progress" aria-hidden="true"><span id="progress-fill"></span></div>
    <span class="bar-label" id="page-label"></span>
    <button type="button" id="next-button" class="bar-arrow" aria-label="次の頁">›</button>
    <button type="button" id="today-button" class="bar-button">今日の満足</button>
  </nav>
  <p class="hint" id="hint" hidden>端をタップ・スワイプ・矢印キーで頁をめくれます</p>

  <dialog class="drawer" id="toc-dialog">
    <form method="dialog">
      <div class="drawer-head"><span>目次</span><button type="submit" aria-label="閉じる">×</button></div>
      <div id="toc-list"></div>
    </form>
  </dialog>

  <dialog class="today-dialog" id="today-dialog">
    <form method="dialog">
      <p class="today-date" id="today-date"></p>
      <p class="today-verse" id="today-verse"></p>
      <p class="today-source" id="today-source"></p>
      <div class="today-actions">
        <button type="button" id="today-another">もう一節</button>
        <button type="submit">閉じる</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="book.js"></script>
</body>
</html>
